# Drop this file into any WSO2 repo at .github/workflows/semgrep-security.yaml
#
# Required secrets (if vulnerability-scanner is private):
#   REPO_ACCESS_TOKEN - GitHub PAT with `repo` scope
#
# Optional secrets (for Claude Code false-positive filtering):
#   ANTHROPIC_API_KEY - Anthropic API key from console.anthropic.com
name: Security Scan (WSO2 Custom Rules)

on:
  workflow_dispatch:
    inputs:
      scan-paths:
        description: "Paths to scan (space-separated, relative to repo root)"
        required: false
        default: "."
        type: string
      severity-threshold:
        description: "Minimum severity"
        required: false
        default: "WARNING"
        type: choice
        options:
          - INFO
          - WARNING
          - ERROR
      fail-on-error:
        description: "Fail if ERROR-severity findings exist"
        required: false
        default: false
        type: boolean
      rules-ref:
        description: "Rules repo branch/tag to use"
        required: false
        default: "master"
        type: string
      run-claude-analysis:
        description: "Run Claude Code to filter false positives"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  security-events: write

env:
  SARIF_FILE: results.sarif
  FILTERED_SARIF: filtered.sarif
  VULN_SCANNER_PATH: _vuln-scanner

jobs:
  semgrep-scan:
    name: Semgrep Custom Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout custom rules and analysis tools
        uses: actions/checkout@v4
        with:
          repository: jhivandb/vulnerability-scanner
          ref: ${{ inputs.rules-ref }}
          path: ${{ env.VULN_SCANNER_PATH }}
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}
          sparse-checkout: |
            semgrep-rules/rules
            .claude/skills/sarif/scripts
            vulnerabilities.md
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        id: scan
        run: |
          set +e
          semgrep scan \
            --config "$VULN_SCANNER_PATH/semgrep-rules/rules" \
            --sarif \
            --output "$SARIF_FILE" \
            --no-git-ignore \
            --severity "${{ inputs.severity-threshold }}" \
            ${{ inputs.scan-paths }}
          set -e

          python3 << 'EOF' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          sarif_path = Path("results.sarif")
          if not sarif_path.exists():
              print("errors=0")
              print("warnings=0")
              print("notes=0")
              print("total=0")
          else:
              sarif = json.loads(sarif_path.read_text())
              results = sarif.get("runs", [{}])[0].get("results", [])
              levels = {"error": 0, "warning": 0, "note": 0}
              for r in results:
                  level = r.get("level", "warning")
                  if level in levels:
                      levels[level] += 1
              print(f"errors={levels['error']}")
              print(f"warnings={levels['warning']}")
              print(f"notes={levels['note']}")
              print(f"total={len(results)}")
          EOF

      - name: Set up Node.js
        if: inputs.run-claude-analysis && steps.scan.outputs.total != '0'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        if: inputs.run-claude-analysis && steps.scan.outputs.total != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Analyze findings with Claude Code
        id: claude-analysis
        if: inputs.run-claude-analysis && steps.scan.outputs.total != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set, skipping Claude analysis"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SARIF_READER="$VULN_SCANNER_PATH/.claude/skills/sarif/scripts/sarif.py"
          VULN_PATTERNS="$VULN_SCANNER_PATH/vulnerabilities.md"

          echo "::group::Claude Code Analysis"
          echo "Analyzing ${{ steps.scan.outputs.total }} findings..."
          echo "SARIF: $SARIF_FILE | Knowledge base: $VULN_PATTERNS"
          echo ""

          timeout 600 stdbuf -oL claude --print \
            --dangerously-skip-permissions \
            --model sonnet \
            --verbose \
            --allowedTools "Read,Grep,Glob,Bash(python3*),Write" \
            --max-turns 100 \
            "$(cat << PROMPT_EOF
You are an elite security code analyst specializing in vulnerability triage. Your mission is to eliminate false positives while ensuring NO TRUE VULNERABILITIES ARE MISSED. You prioritize recall (catching all real issues) over precision.

**CRITICAL: When in doubt, err on the side of TRUE_POSITIVE. It is better to flag a potential issue for human review than to miss a real vulnerability.**

## Execution Steps

1. Read the vulnerability patterns knowledge base completely first
2. Get the finding count and list all findings
3. Group findings by file to minimize reads
4. For EACH finding systematically:
   - Read the FULL function/method containing the flagged code (prefer reading entire file for context)
   - Compare against the 11 documented vulnerability patterns
   - Assign a verdict with confidence level
5. Create annotations.json with verdicts
6. Generate filtered SARIF and summary

## Tools Available

SARIF reader commands:
  python3 $SARIF_READER count $SARIF_FILE
  python3 $SARIF_READER list $SARIF_FILE
  python3 $SARIF_READER get $SARIF_FILE <index>
  python3 $SARIF_READER annotate $SARIF_FILE -a annotations.json -o $FILTERED_SARIF

Knowledge base: Read the file at $VULN_PATTERNS

## Pattern Matching Checklist

For each finding, check against these specific patterns from the knowledge base:

1. **SQL Injection**: String replacement for ORDER BY/column names? (not parameterized)
2. **Path Traversal**: URL decoding BEFORE path validation? (order matters)
3. **MIME Type Spoofing**: Extension-only validation without magic bytes?
4. **Auth Bypass**: Hardcoded exemption paths without proper checks?
5. **Account State**: Missing account status validation in auth flows?
6. **HTTP Method-URI**: Method and path validated independently? (must be together)
7. **XSS**: Missing context-appropriate output encoding?
8. **Input Validation**: Missing length limits, format checks, sanitization?
9. **Token Lifecycle**: Tokens not invalidated on logout/password change?
10. **Info Disclosure**: Sensitive data in logs or error messages?
11. **Scope Auth**: Missing scope verification for API operations?

## Verdict Decision Framework

Mark as **TRUE_POSITIVE** if:
- Code pattern matches documented vulnerable examples
- No mitigating controls in surrounding context
- Attack vector is actually exploitable
- Data flows from user input to sensitive sink without sanitization
- You are UNCERTAIN (default to TRUE_POSITIVE)

Mark as **FALSE_POSITIVE** only if you have HIGH CONFIDENCE that:
- Code uses safe patterns from the fix examples in knowledge base
- Mitigating controls definitively exist upstream/downstream
- Code is unreachable with user-controlled input (prove it)
- Code is in test files, examples, or clearly deprecated
- Framework provides automatic protection (cite specific mechanism)

## Confidence Levels

For each finding, record confidence:
- **HIGH**: Clear evidence supports verdict, no ambiguity
- **MEDIUM**: Likely correct but some uncertainty
- **LOW**: Uncertain - if LOW and leaning FALSE_POSITIVE, change to TRUE_POSITIVE

## Error Handling

- If source file cannot be read: Mark as TRUE_POSITIVE with note "Unable to verify - source unavailable"
- If code context is unclear: Mark as TRUE_POSITIVE with note "Requires manual review"
- If pattern doesn't clearly match safe examples: TRUE_POSITIVE

## Output Requirements

1. **annotations.json**: {"keep": [indices], "notes": {"index": "VERDICT: reasoning"}}
2. **$FILTERED_SARIF**: Filtered SARIF with only true positives
3. **analysis-summary.md**: Summary table with verdict, confidence, and reasoning for each finding

## Quality Checklist (verify before finishing)

- [ ] Read code context for EVERY finding (not sampled)
- [ ] Double-checked all LOW confidence verdicts
- [ ] All uncertain findings marked TRUE_POSITIVE
- [ ] Annotations file has notes for every finding
- [ ] Finding counts match between annotations and output
PROMPT_EOF
          )"
          CLAUDE_EXIT=$?
          echo "::endgroup::"

          if [ $CLAUDE_EXIT -ne 0 ]; then
            if [ $CLAUDE_EXIT -eq 124 ]; then
              echo "::warning::Claude analysis timed out after 10 minutes"
            else
              echo "::warning::Claude analysis failed with exit code $CLAUDE_EXIT"
            fi
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "$FILTERED_SARIF" ]; then
            echo "::warning::Claude analysis did not produce filtered.sarif"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skipped=false" >> "$GITHUB_OUTPUT"
          python3 << 'EOF'
          import json
          import os

          with open("filtered.sarif") as f:
              sarif = json.load(f)
          meta = sarif.get("runs", [{}])[0].get("properties", {}).get("analysisMetadata", {})
          tp, fp = meta.get("truePositiveCount", 0), meta.get("falsePositiveCount", 0)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"true_positives={tp}\n")
              out.write(f"false_positives={fp}\n")

          print(f"Analysis complete: {tp} true positives, {fp} false positives")
          EOF

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.claude-analysis.outputs.skipped != 'true' && hashFiles('filtered.sarif') != '' && 'filtered.sarif' || 'results.sarif' }}
          category: wso2-semgrep-custom

      - name: Upload SARIF artifacts
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: |
            results.sarif
            filtered.sarif
            analysis-summary.md
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          {
            echo "## WSO2 Semgrep Security Scan"
            echo ""
            echo "### Raw Scan Results"
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| ERROR    | ${{ steps.scan.outputs.errors }} |"
            echo "| WARNING  | ${{ steps.scan.outputs.warnings }} |"
            echo "| INFO     | ${{ steps.scan.outputs.notes }} |"
            echo "| **Total**| **${{ steps.scan.outputs.total }}** |"
            echo ""

            if [ "${{ steps.claude-analysis.outputs.skipped }}" != "true" ]; then
              echo "### Claude Code Analysis"
              echo "| Category | Count |"
              echo "|----------|-------|"
              echo "| True Positives | ${{ steps.claude-analysis.outputs.true_positives }} |"
              echo "| False Positives | ${{ steps.claude-analysis.outputs.false_positives }} |"
              echo ""
              echo "Claude analyzed each finding against documented vulnerability patterns."
              echo ""
              if [ -f analysis-summary.md ]; then
                echo "#### Analysis Details"
                cat analysis-summary.md
                echo ""
              fi
            fi

            echo "Full results: **Security tab -> Code scanning alerts** (repo admins only)"
            echo ""
            echo "SARIF files available as build artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on ERROR findings
        if: inputs.fail-on-error && steps.scan.outputs.errors != '0'
        run: |
          CLAUDE_SKIPPED="${{ steps.claude-analysis.outputs.skipped }}"
          TRUE_POSITIVES="${{ steps.claude-analysis.outputs.true_positives }}"

          if [ "$CLAUDE_SKIPPED" != "true" ] && [ -n "$TRUE_POSITIVES" ] && [ "$TRUE_POSITIVES" != "0" ]; then
            echo "::error::Found $TRUE_POSITIVES verified security findings. See the Security tab for details."
            exit 1
          elif [ "$CLAUDE_SKIPPED" = "true" ]; then
            echo "::error::Found ${{ steps.scan.outputs.errors }} ERROR-severity findings. See the Security tab for details."
            exit 1
          fi
